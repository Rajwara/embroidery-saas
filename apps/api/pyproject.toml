[project]
name = "embroidery-saas-api"
version = "0.1.0"
description = "Embroidery Factory Management SaaS - Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "pyotp>=2.9",
    "redis>=5.0",
    "weasyprint>=62.0",
    "resend>=2.0",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
]
